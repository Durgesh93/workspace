name: venv_pt_cuda

channels:
  - conda-forge
  - defaults

dependencies:
  # -----------------------------
  # Conda packages
  # These install only if helper uses conda/micromamba.
  # Plain venv will ignore these.
  # -----------------------------
  - python=3.11
  - pip
  - gh
  - poetry
  - ffmpeg

  - pip:
      # -----------------------------
      # Trusted hosts
      # -----------------------------
      - --trusted-host pypi.org
      - --trusted-host files.pythonhosted.org
      - --trusted-host download.pytorch.org
      - --trusted-host download-r2.pytorch.org

      # -----------------------------
      # Avoid source builds for heavy scientific packages on Olivia ARM64
      # -----------------------------
      - --prefer-binary
      - --only-binary=numpy,pandas,scipy,scikit-learn,pyarrow,h5py,Pillow,scikit-image,opencv-python-headless,matplotlib

      # -----------------------------
      # PyTorch CUDA 12.8 for Olivia GH200/H200 ARM64
      #
      # Important:
      # - torch is CUDA wheel: 2.7.1+cu128
      # - triton URL is NOT under /cu128/
      # - torchvision/torchaudio aarch64 wheels are without +cu128
      # -----------------------------
      - https://download-r2.pytorch.org/whl/triton-3.3.1-cp311-cp311-manylinux_2_27_aarch64.manylinux_2_28_aarch64.whl
      - https://download-r2.pytorch.org/whl/cu128/torch-2.7.1%2Bcu128-cp311-cp311-manylinux_2_28_aarch64.whl
      - https://download-r2.pytorch.org/whl/cu128/torchvision-0.22.1-cp311-cp311-manylinux_2_28_aarch64.whl
      - https://download-r2.pytorch.org/whl/cu128/torchaudio-2.7.1-cp311-cp311-manylinux_2_28_aarch64.whl

      # -----------------------------
      # Core data science
      # -----------------------------
      - numpy==1.26.4
      - pandas
      - scipy
      - scikit-learn
      - statsmodels
      - pyarrow>=17,<25
      - networkx

      # -----------------------------
      # PyTorch ecosystem
      # -----------------------------
      - torchmetrics
      - torchsummary
      - torchdata
      - lightning

      # -----------------------------
      # Probabilistic programming
      # -----------------------------
      - pyro-ppl

      # -----------------------------
      # Hugging Face / NLP
      # -----------------------------
      - transformers
      - datasets
      - accelerate
      - nltk

      # -----------------------------
      # Biosignal processing: EDA / PPG / HRV
      # -----------------------------
      - neurokit2
      - biosppy
      - heartpy
      - pyhrv
      - bioread

      # -----------------------------
      # Image / signal / scientific utilities
      # -----------------------------
      - Pillow
      - scikit-image
      - imageio
      - opencv-python-headless
      - albumentations
      - astropy
      - pydicom
      - h5py

      # -----------------------------
      # Visualization
      # -----------------------------
      - matplotlib
      - seaborn
      - plotly
      - dash
      - kaleido
      - plotext
      - umap-learn

      # -----------------------------
      # Experiment tracking / MLOps
      # -----------------------------
      - wandb
      - mlflow
      - hydra-core

      # -----------------------------
      # Jupyter / notebooks
      # -----------------------------
      - jupyterlab
      - ipykernel
      - ipywidgets
      - ipython
      - jupyter-client
      - traitlets
      - pygments

      # -----------------------------
      # File / spreadsheet utilities
      # -----------------------------
      - openpyxl
      - gdown
      - fs
      - ffprobe-python

      # -----------------------------
      # Developer tools / general utilities
      # -----------------------------
      - requests
      - six
      - skorch
      - natsort
      - pipdeptree
      - python-daemon
      - tabulate
      - psutil
      - tqdm
      - rich
      - pytest
      - typer
      - click
      - pyaml
